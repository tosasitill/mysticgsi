name: MysticGSI - Build

# Build a GSI from a publicly reachable stock firmware archive.  The build is
# intentionally manual: firmware archives are large and are not suitable for
# storing in the repository or passing as workflow artifacts.
on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Name used for the temporary and output directories"
        required: true
        default: "mysticgsi"
        type: string
      firmware_url:
        description: "Public URL of the stock firmware archive"
        required: true
        type: string
      rom_type:
        description: "ROM type override (auto, generic, custom, or a supported patch name)"
        required: true
        default: "auto"
        type: string
      variant_tag:
        description: "Optional variant tag appended to the build name"
        required: false
        default: ""
        type: string
      compress:
        description: "Also create a ZIP containing system.img"
        required: true
        default: true
        type: boolean
      no_debloat:
        description: "Keep apps normally removed by the patch set"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mysticgsi-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.build_name }}
    # slimhub_actions supports the current Ubuntu images explicitly.  Pinning
    # the image avoids an unexpected runner change during a long build.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # A stock firmware can expand to many gigabytes.  Remove unused
      # preinstalled software before downloading it, as in the OrangeFox
      # builder, then add swap for filesystem/image creation.
      - name: Free runner disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Add swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Show runner capacity
        shell: bash
        run: |
          set -euo pipefail
          echo "Memory and swap:"
          free -h
          swapon --show || true
          echo
          echo "Filesystem capacity:"
          df -h "${GITHUB_WORKSPACE}"

      - name: Install build environment
        shell: bash
        run: |
          set -euo pipefail
          ./setup_host.py
          .venv/bin/python -c 'import tools; tools.check_environment()'

      - name: Build GSI
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          FIRMWARE_URL: ${{ inputs.firmware_url }}
          ROM_TYPE: ${{ inputs.rom_type }}
          VARIANT_TAG: ${{ inputs.variant_tag }}
          COMPRESS: ${{ inputs.compress }}
          NO_DEBLOAT: ${{ inputs.no_debloat }}
        shell: bash
        run: |
          set -euo pipefail

          # Use an array so URLs containing '?', '&', or '=' are passed to
          # Python as one argument and never interpreted by the shell.
          args=(build "$BUILD_NAME" "$FIRMWARE_URL" --type "$ROM_TYPE")
          if [[ -n "$VARIANT_TAG" ]]; then
            args+=(--add "$VARIANT_TAG")
          fi
          if [[ "$COMPRESS" == "true" ]]; then
            args+=(--compress)
          fi
          if [[ "$NO_DEBLOAT" == "true" ]]; then
            args+=(--no-debloat)
          fi

          .venv/bin/python cli.py "${args[@]}"

      - name: Collect and verify outputs
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          ROM_TYPE: ${{ inputs.rom_type }}
          VARIANT_TAG: ${{ inputs.variant_tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          images=(out/*/*.img)
          if (( ${#images[@]} == 0 )); then
            echo "No system image was produced under out/" >&2
            find out -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi

          rm -rf release
          mkdir -p release
          max_part_bytes=$((1900 * 1024 * 1024))
          original_checksums=$(mktemp)
          : > "$original_checksums"

          # Release assets are limited to less than 2 GiB each.  Keep the
          # original files for workflow artifacts, but split oversized files
          # into 1900 MiB parts for the release.  The fixed-width suffix keeps
          # shell glob ordering stable when the file is reassembled.
          outputs=(out/*/*.img out/*/*.zip)
          for source in "${outputs[@]}"; do
            [[ -f "$source" ]] || continue
            name=$(basename "$source")
            sha256sum -- "$source" | awk -v name="$name" '{print $1 "  " name}' >> "$original_checksums"
            file_size=$(wc -c < "$source")
            if (( file_size > max_part_bytes )); then
              split -b 1900M -d -a 4 -- "$source" "release/${name}.part."
            else
              cp -- "$source" "release/${name}"
            fi
          done

          for file in out/*/output.txt; do
            [[ -f "$file" ]] || continue
            cp -- "$file" release/
          done

          # This manifest is checked after concatenating any .part.* files.
          cp -- "$original_checksums" release/SHA256SUMS.reassembled

          cat > release/REASSEMBLE.md <<'EOF'
          # Reassembling large output files

          GitHub Release limits an individual asset to 2 GiB, so large
          `system.img`/`.zip` files are published as `.part.000`, `.part.001`,
          and so on.  Download all parts for a file into one directory and run:

          ```sh
          cat 'FILE.part.'* > 'FILE'
          sha256sum -c SHA256SUMS.reassembled
          ```

          Replace `FILE` with the original filename shown in
          `SHA256SUMS.reassembled`.
          EOF

          # Write the release-asset checksum list outside release first so
          # SHA256SUMS does not accidentally contain a checksum of itself.
          checksums=$(mktemp)
          (
            cd release
            for file in *; do
              [[ "$file" == "SHA256SUMS" ]] && continue
              sha256sum -- "$file"
            done
          ) > "$checksums"
          mv -- "$checksums" release/SHA256SUMS
          {
            echo "### MysticGSI build"
            echo
            echo "- Build name: \`$BUILD_NAME\`"
            echo "- ROM type: \`$ROM_TYPE\`"
            if [[ -n "$VARIANT_TAG" ]]; then
              echo "- Variant: \`$VARIANT_TAG\`"
            fi
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "Release files (with SHA-256 checksums):"
            echo
            echo '```text'
            cat release/SHA256SUMS
            echo '```'
            echo
            echo "Large image/archive files are split into 1900 MiB parts for the GitHub Release asset limit."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Produced files:"
          du -h release/*

      # upload-artifact has a roughly 10 GB limit per artifact.  Upload the
      # original image and ZIP as separate artifacts instead of combining them
      # (which would exceed that limit for large builds).  If the repository's
      # artifact quota is exhausted, keep going so the split Release is still
      # published.
      - name: Upload system image artifact
        id: upload_image
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mysticgsi-${{ inputs.build_name }}-system-img-${{ github.run_id }}
          path: out/*/*.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload ZIP artifact
        id: upload_zip
        if: ${{ inputs.compress == true }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mysticgsi-${{ inputs.build_name }}-zip-${{ github.run_id }}
          path: out/*/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Report artifact upload status
        if: always()
        env:
          IMAGE_STATUS: ${{ steps.upload_image.outcome }}
          ZIP_STATUS: ${{ steps.upload_zip.outcome }}
          COMPRESS: ${{ inputs.compress }}
        shell: bash
        run: |
          {
            echo "### Workflow artifact uploads"
            echo "- system.img artifact: ${IMAGE_STATUS}"
            if [[ "$COMPRESS" == "true" ]]; then
              echo "- ZIP artifact: ${ZIP_STATUS}"
            else
              echo "- ZIP artifact: not requested"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set release metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=mysticgsi-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          name: MysticGSI ${{ inputs.build_name }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body: |
            ## MysticGSI GSI build

            - Build name: `${{ inputs.build_name }}`
            - ROM type: `${{ inputs.rom_type }}`
            - Variant: `${{ inputs.variant_tag || 'default' }}`
            - Source commit: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            The release contains `system.img` (and, when requested, the ZIP
            archive) either directly or as 1900 MiB `.part.*` files, together
            with `REASSEMBLE.md`, `output.txt`, and SHA-256 manifests.
